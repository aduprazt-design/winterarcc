<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Winter Arc">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Winter Arc Alpineo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14213D; --ink2:#53617E; --ink3:#8C97AD; --line:#E1E7F0; --line2:#C9D3E3;
  --frost:#EEF4FF; --frost2:#DCE7FF; --glacier:#2E6CF6; --glacier-d:#1D4CC0;
  --plus:#17B26A; --plus-d:#0E8A50; --plus-bg:#E6F8EE;
  --minus:#F04452; --minus-d:#C02734; --minus-bg:#FDECEE;
  --gold:#FFC531; --silver:#D3DAE5; --bronze:#F0A266;
  --display:'Big Shoulders Display','Arial Narrow','Roboto Condensed',Impact,sans-serif;
  --body:'Nunito',ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:rgba(255,255,255,.94)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible,.field:focus{outline:3px solid var(--glacier);outline-offset:2px}
input{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:480px;margin:0 auto;padding:0 16px}
.muted{color:var(--ink2);font-weight:600;font-size:14px;margin:6px 0}
.muted.small{font-size:13px;margin-top:14px}
.c{text-align:center}
.lede{font-size:16px;font-weight:600;color:var(--ink2);margin:4px 0 16px;max-width:38ch}
.err{background:var(--minus-bg);color:var(--minus-d);border:2px solid var(--minus);border-radius:14px;padding:12px 14px;font-weight:800;font-size:15px}
.offline{background:#FFF6DB;border:2px solid var(--gold);border-radius:12px;padding:8px 12px;font-weight:800;font-size:13px;margin:12px 0 0}

/* Typo */
.h1{font-family:var(--display);font-weight:900;font-size:46px;line-height:.9;margin:22px 0 8px;letter-spacing:.005em}
.h2{font-family:var(--display);font-weight:900;font-size:34px;line-height:.95;margin:6px 0 6px}
.h3{font-family:var(--display);font-weight:800;font-size:24px;margin:20px 0 8px}
.sec{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;margin:30px 0 12px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec span{font-family:var(--body);font-size:13px;font-weight:800;color:var(--ink2);text-align:right}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 22px;border-radius:16px;border:2px solid var(--ink);background:var(--glacier);color:#fff;font-weight:900;font-size:17px;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;text-align:center}
.btn svg{width:20px;height:20px}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.plus{background:var(--plus)}
.btn.danger{color:var(--minus-d)}
.btn.block{width:100%;margin-top:12px}
.btn.sm{min-height:42px;font-size:15px;padding:0 16px;border-radius:13px}
.btn:disabled{cursor:default}
.btn.ghost:disabled{box-shadow:0 4px 0 var(--line2);border-color:var(--line2);color:var(--plus-d)}
.btn:not(.ghost):disabled{opacity:.6}
.icbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;border:2px solid var(--line2);color:var(--ink)}
.icbtn svg{width:20px;height:20px}
.icbtn.sm{width:34px;height:34px;border-color:transparent;color:var(--ink3)}
.icbtn.spin svg{animation:spin .7s linear infinite}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:900;color:var(--ink2);margin:16px 0 6px;padding:6px 0}
.back svg{width:20px;height:20px}

/* Header + tabs */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:2px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
.brand{font-family:var(--display);font-weight:900;font-size:27px;line-height:.85;text-transform:uppercase;letter-spacing:.01em}
.brand small{display:block;font-family:var(--body);text-transform:none;font-size:12px;font-weight:900;color:var(--glacier);letter-spacing:0;margin-top:2px}
.top-r{display:flex;align-items:center;gap:8px}
.jchip{font-family:var(--display);font-weight:900;font-size:19px;padding:4px 10px;border-radius:10px;background:var(--ink);color:#fff;line-height:1.1}
main.wrap{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:flex;justify-content:space-between;align-items:center;height:70px;padding:0 6px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:900;color:var(--ink3);text-align:center}
.tab .ic{width:44px;height:32px;display:grid;place-items:center;border-radius:12px;transition:background .15s}
.tab .ic svg{width:25px;height:25px}
.tab.on{color:var(--glacier)}
.tab.on .ic{background:var(--frost)}
.tab .meic .avh{width:30px;height:30px;border-width:2px}
.tab.on .meic{background:none}
.tab.on .meic .avh{box-shadow:0 0 0 3px var(--glacier)}
.tab.add .ic{width:56px;height:56px;margin-top:-26px;border-radius:19px;background:var(--glacier);color:#fff;border:2px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.tab.add .ic svg{width:28px;height:28px}
.tab.add.on .ic{background:var(--plus)}
.tab.add:active .ic{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

/* Avatars */
.avh{--c:#2E6CF6;width:44px;height:44px;flex:none;border-radius:30%;border:2px solid var(--ink);background:var(--c);overflow:hidden;display:block}
.avh svg{width:100%;height:100%;display:block}
.avh.xs{width:28px;height:28px}
.avh.lg{width:96px;height:96px;border-width:3px;margin:8px auto}
.avh.ghost{border-color:transparent;background:none}

/* Hero */
.hero{margin-top:16px;border:2px solid var(--ink);border-radius:28px;box-shadow:0 5px 0 var(--ink);background:var(--frost);overflow:hidden;position:relative}
.hero-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 18px 4px}
.hero-top>div:first-child{flex:none}
.jbig{font-family:var(--display);font-weight:900;font-size:clamp(76px,24vw,104px);line-height:.78;letter-spacing:-.01em;white-space:nowrap}
.jsmall{font-weight:900;font-size:14px;color:var(--ink2);margin-top:8px}
.hero-meta{text-align:right;font-weight:800;font-size:13px;color:var(--ink2);padding-bottom:22px}
.hero-meta b{display:block;font-family:var(--display);font-weight:900;font-size:26px;color:var(--ink);line-height:1}
.hero-meta b i{font-style:normal;color:var(--ink3)}
.track{margin:12px 18px 0;height:16px;border:2px solid var(--ink);border-radius:99px;background:#fff;position:relative;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(-45deg,var(--glacier) 0 8px,#4F86FF 8px 16px);border-right:2px solid var(--ink)}
.track-l{display:flex;justify-content:space-between;margin:4px 20px 0;font-size:11px;font-weight:900;color:var(--ink3)}
.timer{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:12px 18px 2px}
.timer div{background:#fff;border:2px solid var(--ink);border-radius:12px;text-align:center;padding:5px 0 3px}
.timer b{display:block;font-family:var(--display);font-weight:900;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.timer small{font-size:11px;font-weight:800;color:var(--ink2)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;padding:22px 14px 0;margin-top:6px;background:linear-gradient(#fff0 0 55%,#fff 55%)}
.pod{flex:1;max-width:122px;display:flex;flex-direction:column;align-items:center;text-align:center}
.pod:disabled{opacity:.6}
.pod-av{position:relative;width:78%;display:block;margin-bottom:-8px;z-index:1}
.pod-av svg{width:100%;height:auto;display:block}
.p1 .pod-av{width:92%}
.crown{position:absolute;top:-20px;left:50%;transform:translateX(-50%) rotate(-8deg);font-size:28px;z-index:2}
.block{width:100%;border:2px solid var(--ink);border-bottom:0;border-radius:14px 14px 0 0;display:flex;flex-direction:column;align-items:center;padding:6px 4px 8px}
.p1 .block{background:var(--gold);height:132px}
.p2 .block{background:var(--silver);height:110px}
.p3 .block{background:var(--bronze);height:96px}
.pn{font-family:var(--display);font-weight:900;font-size:40px;line-height:.9}
.pnm{font-weight:900;font-size:13px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ppt{font-weight:800;font-size:12px;opacity:.75}
.roster{display:flex;justify-content:center;align-items:flex-end;padding:20px 10px 14px;margin-top:6px;background:linear-gradient(#fff0 0 72%,#fff 72%)}
.ro{width:74px;margin:0 -6px;display:flex;flex-direction:column;align-items:center}
.ro svg{width:100%;height:auto}
.ro span{font-size:11px;font-weight:900;margin-top:-2px;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ro-more{font-family:var(--display);font-weight:900;font-size:26px;align-self:center;margin-left:12px}

/* Classements */
.board{border:2px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink);overflow:hidden;background:#fff}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:2px solid var(--line);width:100%;text-align:left}
.row:first-child{border-top:0}
.row.me{background:var(--frost)}
.row.lose{background:var(--minus-bg)}
.row.whead{padding:8px 12px 4px}
.rk{width:24px;flex:none;font-family:var(--display);font-weight:900;font-size:24px;text-align:center;color:var(--ink2)}
.rk1{color:#C99300}.rk2{color:#8C98AC}.rk3{color:#C8783B}
.who{flex:1;min-width:0;display:flex;flex-direction:column}
.who b{font-weight:900;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti{font-size:14px}
.pm{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:900;margin-top:1px}
.pm .p{color:var(--plus-d)}.pm .m{color:var(--minus-d)}
.tr{font-size:11px;font-weight:900;padding:0 5px;border-radius:6px}
.tr.up{color:var(--plus-d);background:var(--plus-bg)}.tr.down{color:var(--minus-d);background:var(--minus-bg)}
.dbar{position:relative;height:7px;margin-top:6px;background:var(--line);border-radius:7px;overflow:hidden}
.dbar::after{content:"";position:absolute;left:50%;top:-1px;bottom:-1px;width:2px;background:var(--ink);transform:translateX(-1px)}
.dbar .g{position:absolute;left:50%;top:0;bottom:0;background:var(--plus)}
.dbar .r{position:absolute;right:50%;top:0;bottom:0;background:var(--minus)}
.tot{font-family:var(--display);font-weight:900;font-size:32px;min-width:44px;text-align:right;line-height:1}
.tot.neg{color:var(--minus)}
.tot.sm{font-family:var(--body);font-size:11px;font-weight:900;color:var(--ink3)}
.days{display:flex;gap:4px;margin-top:5px}
.dsq{width:24px;height:24px;border-radius:7px;font-size:11px;font-weight:900;display:grid;place-items:center;position:relative;flex:none}
.dsq.lbl{height:14px;color:var(--ink3);font-size:11px}
.dsq.pos{background:var(--plus);color:#fff}
.dsq.neg{background:var(--minus);color:#fff}
.dsq.zero{background:var(--line);color:var(--ink2)}
.dsq.miss{background:var(--minus-bg);color:var(--minus-d);border:2px solid var(--minus)}
.dsq.open{border:2px dashed var(--line2)}
.dsq.fut{background:#F4F6FA}
.days.big{gap:6px;justify-content:space-between}
.days.big .dsq{width:auto;flex:1;height:52px;border-radius:12px;font-size:16px;font-family:var(--display);font-weight:900;padding-bottom:12px}
.days.big .dsq em{position:absolute;bottom:4px;font-style:normal;font-family:var(--body);font-size:10px;font-weight:900;opacity:.75}
.board-foot{font-size:13px;font-weight:700;color:var(--ink2);margin:10px 4px 0}

/* Cartes */
.card{background:#fff;border:2px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink);padding:16px}
.card.locked{text-align:center;padding:26px 18px}
.lock-em{font-size:40px;display:block}
.card.locked b{display:block;font-size:18px;margin:8px 0 4px}
.chart-card{padding:12px 10px 12px}
.chart{width:100%;height:auto;display:block}
.chart .ax{font-family:var(--body);font-size:10px;font-weight:800;fill:var(--ink3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:8px 6px 0;font-size:12px;font-weight:800;color:var(--ink2)}
.lg{display:inline-flex;align-items:center;gap:5px}
.lg i{width:12px;height:12px;border-radius:4px;border:2px solid var(--ink)}
.lg.me{color:var(--ink)}
.invite{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:30px 0 0;padding:14px 16px;border-radius:20px;background:var(--frost);border:2px dashed var(--glacier)}
.invite b{display:block;font-weight:900}
.invite span{display:block;font-size:13px;font-weight:700;color:var(--ink2);line-height:1.3;margin-top:2px}

/* Gage */
.gage-lead{font-weight:800;margin:0 0 4px}
.losers{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.loser{display:inline-flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:99px;background:var(--minus-bg);border:2px solid var(--minus)}
.loser .avh{width:32px;height:32px}
.loser b{font-weight:900;font-size:14px}
.reel{height:124px;overflow:hidden;border:2px solid var(--ink);border-radius:16px;background:var(--ink);color:#fff;position:relative}
.reel::before,.reel::after{content:"";position:absolute;left:0;right:0;height:22px;z-index:1;pointer-events:none}
.reel::before{top:0;background:linear-gradient(var(--ink),#14213D00)}
.reel::after{bottom:0;background:linear-gradient(#14213D00,var(--ink))}
.reel.done{background:var(--gold);color:var(--ink);height:auto;min-height:124px}
.reel.done::before,.reel.done::after{display:none}
.reel-item{height:124px;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 16px;font-weight:900;font-size:17px;line-height:1.25}
.reel.done .reel-item{height:auto;min-height:124px;font-size:19px}
.reel-item.q{font-family:var(--display);font-size:64px}
.gage-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:12px;font-size:13px;font-weight:800;color:var(--ink2)}
.tag{display:inline-block;font-style:normal;font-size:11px;font-weight:900;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--ink);vertical-align:middle}
.tag.red{background:var(--minus);color:#fff}
.tag.green{background:var(--plus);color:#fff}
.tag.gold{background:var(--gold);color:var(--ink)}

/* Règles */
.rules{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rcol{border:2px solid var(--ink);border-radius:18px;padding:12px;box-shadow:0 4px 0 var(--ink)}
.rcol.plus{background:var(--plus-bg)}.rcol.minus{background:var(--minus-bg)}
.rcol h3{font-family:var(--display);font-weight:900;font-size:40px;margin:0 0 4px;line-height:1}
.rcol.plus h3{color:var(--plus-d)}.rcol.minus h3{color:var(--minus-d)}
.rcol p{display:flex;gap:8px;margin:8px 0;align-items:flex-start}
.rcol .re{font-size:18px;line-height:1.1}
.rcol b{display:block;font-size:13px;font-weight:900;line-height:1.15}
.rcol small{display:block;font-size:11px;font-weight:700;color:var(--ink2);line-height:1.2}
.rcol .note{font-size:11px;font-weight:900;color:var(--ink2);border-top:2px dashed var(--line2);padding-top:8px;margin-bottom:0}
.rule-list p{font-size:15px;font-weight:600;color:var(--ink2);margin:12px 0}
.rule-list b{color:var(--ink)}

/* Ma journée */
.log-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px;min-height:44px}
.log-date{font-weight:900;color:var(--ink2);margin:0;font-size:15px}
.log-date::first-letter{text-transform:uppercase}
.seg{display:flex;background:var(--frost);border:2px solid var(--ink);border-radius:15px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 12px;border-radius:11px;font-weight:900;font-size:14px;color:var(--ink2);border:2px solid transparent;white-space:nowrap;text-align:center}
.seg button.on{background:#fff;color:var(--ink);border-color:var(--ink);box-shadow:0 2px 0 var(--ink)}
.scorepanel{display:flex;align-items:center;justify-content:space-between;gap:12px;border:2px solid var(--ink);border-radius:22px;box-shadow:0 4px 0 var(--ink);padding:14px 18px;background:#fff}
.scorepanel .big{font-family:var(--display);font-weight:900;font-size:88px;line-height:.8;color:var(--ink3);transition:color .2s}
.scorepanel.pos{background:var(--plus-bg)}.scorepanel.pos .big{color:var(--plus-d)}
.scorepanel.neg{background:var(--minus-bg)}.scorepanel.neg .big{color:var(--minus-d)}
.sp-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.sp-r span{font-size:13px;font-weight:900;padding:3px 10px;border-radius:99px;background:#fff;border:2px solid var(--line2)}
.chip-p{color:var(--plus-d)}.chip-m{color:var(--minus-d)}
.chip-x{background:var(--gold)!important;border-color:var(--ink)!important}
.chip-x.red{background:var(--minus)!important;color:#fff}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px 12px 14px;border:2px solid var(--line2);border-radius:18px;box-shadow:0 4px 0 var(--line2);background:#fff;min-height:118px;transition:transform .08s,box-shadow .08s,background .15s}
.tile .em{font-size:30px;line-height:1;margin-bottom:6px}
.tiles .tile:last-child:nth-child(odd){grid-column:1/-1;min-height:0}
.tile b{font-weight:900;font-size:15px;line-height:1.15;padding-right:26px}
.tile small{font-size:12px;color:var(--ink2);font-weight:700;line-height:1.25}
.tile .pt{position:absolute;top:10px;right:12px;font-family:var(--display);font-weight:900;font-size:22px;color:var(--ink3)}
.tile .ck{position:absolute;bottom:10px;right:10px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;transform:scale(0);transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.tile .ck svg{width:15px;height:15px}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line2)}
.tile.b.on{border-color:var(--plus-d);box-shadow:0 4px 0 var(--plus-d);background:var(--plus-bg)}
.tile.b.on .pt{color:var(--plus-d)}.tile.b.on .ck{background:var(--plus-d);transform:scale(1)}
.tile.m.on{border-color:var(--minus-d);box-shadow:0 4px 0 var(--minus-d);background:var(--minus-bg)}
.tile.m.on .pt{color:var(--minus-d)}.tile.m.on .ck{background:var(--minus-d);transform:scale(1)}
.savebar{margin-top:8px}
.myweek{padding:12px}
.mw-tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;font-weight:900;color:var(--ink2);font-size:14px}
.mw-tot b{font-family:var(--display);font-size:34px;color:var(--ink);line-height:1}

function shade(hex, amt) {
  if (!isHex(hex)) hex = '#888888';
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = amt < 0 ? x => Math.round(x * (1 + amt)) : x => Math.round(x + (255 - x) * amt);
  return '#' + ((1 << 24) + (f(r) << 16) + (f(g) << 8) + f(b)).toString(16).slice(1);
}
function isLight(hex) {
  const n = parseInt((isHex(hex) ? hex : '#888888').slice(1), 16);
  const r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.72;
}
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

const fmtN = n => n < 0 ? '−' + Math.abs(n) : String(n);
const fmtS = n => n > 0 ? '+' + n : fmtN(n);
const fmtDec = v => String(Math.round(v * 100) / 100).replace('.', ',');
function fmtTime(s) {
  s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h ? `${h}:${pad(m)}:${pad(x)}` : `${m}:${pad(x)}`;
}
function fmtVal(v, unit) {
  if (unit === 'time') return fmtTime(v);
  if (unit === 'kg') return fmtDec(v) + ' kg';
  if (unit === 'km') return fmtDec(v) + ' km';
  return fmtDec(v);
}

async function hashPin(id, pin) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(`winterarc:${id}:${pin}`));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
function extractToken(text) {
  const t = String(text || '').trim();
  const m = t.match(/[#&?]k=([A-Za-z0-9_-]{6,80})/);
  if (m) return m[1];
  return /^[A-Za-z0-9_-]{6,80}$/.test(t) ? t : null;
}

/* ---------- Stockage Supabase (fonctions sécurisées, voir supabase.sql) ---------- */
class ApiErr extends Error { constructor(kind, detail) { super(kind + (detail ? ' ' + detail : '')); this.kind = kind; this.detail = detail; } }
const configReady = () => /^https:\/\/[a-z0-9-]+\.supabase\.(co|in)\/?$/i.test(CONFIG.SUPABASE_URL) && CONFIG.SUPABASE_KEY && !/COLLER/.test(CONFIG.SUPABASE_KEY);

const DB = {
  async rpc(fn, args) {
    const key = CONFIG.SUPABASE_KEY;
    const headers = { apikey: key, 'Content-Type': 'application/json', Accept: 'application/json' };
    if (/^eyJ/.test(key)) headers.Authorization = 'Bearer ' + key;
    let r;
    try { r = await fetch(`${CONFIG.SUPABASE_URL.replace(/\/$/, '')}/rest/v1/rpc/${fn}`, { method: 'POST', cache: 'no-store', headers, body: JSON.stringify(args) }); }
    catch (e) { throw new ApiErr('network'); }
    const j = safeParse(await r.text());
    if (r.ok) return j;
    const msg = String((j && (j.message || j.error || j.hint)) || '');
    for (const k of ['invalid_code', 'bad_pin', 'version_conflict', 'name_taken', 'id_taken', 'bad_name', 'bad_data', 'bad_day', 'bad_image', 'full']) if (msg.includes(k)) throw new ApiErr(k);
    if (r.status === 404 || /Could not find the function|schema cache/i.test(msg)) throw new ApiErr('setup');
    if (r.status === 401 || /api key|apikey|JWT/i.test(msg)) throw new ApiErr('apikey');
    throw new ApiErr('http', msg || r.status);
  },
  async loadAll() {
    const rows = await this.rpc('wa_list', { code: S.token });
    return (Array.isArray(rows) ? rows : []).filter(r => r && r.id && r.data).map(r => ({ ver: r.ver, data: { ...r.data, id: r.id } }));
  },
  async get(id) {
    const rows = await this.rpc('wa_get', { code: S.token, pid: id });
    const r = Array.isArray(rows) && rows[0];
    return r ? { ver: r.ver, data: { ...r.data, id: r.id } } : null;
  },
  login: (id, pinHash) => DB.rpc('wa_login', { code: S.token, pid: id, ppin: pinHash }),
  create: (data, pinHash) => DB.rpc('wa_create', { code: S.token, pid: data.id, ppin: pinHash, pdata: data }),
  save: (data, ver) => DB.rpc('wa_save', { code: S.token, pid: data.id, ppin: S.pinHash, pdata: data, pver: ver ?? null }),
  photoList: since => DB.rpc('wa_photo_list', { code: S.token, since }),
  photoGet: ids => DB.rpc('wa_photo_get', { code: S.token, ids }),
  photoSave: (day, img, caption) => DB.rpc('wa_photo_save', { code: S.token, pid: S.me, ppin: S.pinHash, pday: day, pimg: img, pcaption: caption || null }),
  photoDelete: day => DB.rpc('wa_photo_delete', { code: S.token, pid: S.me, ppin: S.pinHash, pday: day }),
};

function mergePlayer(remote, local) {
  return { ...remote, ...local,
    days: { ...(remote.days || {}), ...(local.days || {}) },
    gages: { ...(remote.gages || {}), ...(local.gages || {}) } };
}

let saveChain = Promise.resolve();
function savePlayer(data) {
  const run = async () => {
    let d = clone(data);
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        const v = await DB.save(d, S.vers[d.id]);
        S.vers[d.id] = v; S.players[d.id] = d; cacheSave(); return d;
      } catch (e) {
        if (e.kind !== 'version_conflict') throw e;
        const remote = await DB.get(d.id);
        if (!remote) throw new ApiErr('http', 'joueur introuvable');
        S.vers[d.id] = remote.ver; d = mergePlayer(remote.data, d);
      }
    }
    throw new ApiErr('conflict');
  };
  const p = saveChain.then(run, run);
  saveChain = p.catch(() => {});
  return p;
}
function cacheSave() { lsSet(LS.cache, JSON.stringify({ at: Date.now(), players: S.players, vers: S.vers })); }
function cacheLoad() { const c = safeParse(lsGet(LS.cache)); return c && c.players ? c : null; }

const PW = 32, PH = 40;
function mix(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = s => Math.round(((pa >> s) & 255) * (1 - t) + ((pb >> s) & 255) * t);
  return '#' + ((1 << 24) + (ch(16) << 16) + (ch(8) << 8) + ch(0)).toString(16).slice(1);
}
class PX {
  constructor() { this.g = Array.from({ length: PH }, () => new Array(PW).fill(null)); }
  p(x, y, c) { if (c && x >= 0 && x < PW && y >= 0 && y < PH) this.g[y][x] = c; }
  r(x, y, w, h, c) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) this.p(i, j, c); }
  s(y, x1, x2, c) { for (let i = x1; i <= x2; i++) this.p(i, y, c); }
  m(x0, y0, rows, pal) { rows.forEach((row, j) => { for (let i = 0; i < row.length; i++) { const k = row[i]; if (k !== '.' && pal[k]) this.p(x0 + i, y0 + j, pal[k]); } }); }
  pts(list, c) { list.forEach(([x, y]) => this.p(x, y, c)); }
}

const secTitle = (t, side = '') => `<h2 class="sec">${t}${side ? `<span>${side}</span>` : ''}</h2>`;

function niceStep(span) {
  const raw = span / 5, mag = Math.pow(10, Math.floor(Math.log10(Math.max(raw, 1e-9))));
  const n = raw / mag; return (n <= 1.5 ? 1 : n <= 3 ? 2 : n <= 7 ? 5 : 10) * mag;
}

/* Graphique cumulé multi-joueurs */
function lineChart(series, n, xLabel) {
  const Wd = 340, Ht = 200, pl = 30, pr = 12, pt = 14, pb = 24;
  const all = series.flatMap(s => s.values);
  let min = Math.min(0, ...all), max = Math.max(1, ...all);
  if (max === min) max = min + 1;
  const step = Math.max(1, niceStep(max - min));
  min = Math.floor(min / step) * step; max = Math.ceil(max / step) * step;
  const x = i => pl + (n <= 1 ? (Wd - pl - pr) / 2 : i * (Wd - pl - pr) / (n - 1));
  const y = v => pt + (max - v) * (Ht - pt - pb) / (max - min);
  let g = '';
  for (let v = min; v <= max + 1e-9; v += step) {
    g += `<line x1="${pl}" x2="${Wd - pr}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 0 ? OUT : '#E4EAF3'}" stroke-width="${v === 0 ? 1.6 : 1}" ${v === 0 ? '' : 'stroke-dasharray="3 4"'}/>`;
    g += `<text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end" class="ax">${fmtN(v)}</text>`;
  }
  for (let i = 0; i < n; i += 7) {
    const w = weekOfIdx(i);
    if (n > 35 && w % 2 === 0) continue;
    g += `<text x="${x(i)}" y="${Ht - 6}" text-anchor="middle" class="ax">${xLabel ? xLabel(i) : 'S' + w}</text>`;
  }
  const lines = series.map(s => {
    const pts = s.values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const li = s.values.length - 1;
    return `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="${s.me ? 4 : 2.6}" stroke-linejoin="round" stroke-linecap="round" opacity="${s.me ? 1 : .85}"/>`
      + `<circle cx="${x(li)}" cy="${y(s.values[li])}" r="${s.me ? 5 : 4}" fill="#fff" stroke="${s.color}" stroke-width="3"/>`;
  });
  const meIdx = series.findIndex(s => s.me);
  if (meIdx >= 0) lines.push(lines.splice(meIdx, 1)[0]);
  return `<svg class="chart" viewBox="0 0 ${Wd} ${Ht}" role="img" aria-label="Évolution des scores">${g}${lines.join('')}</svg>`;
}

function sparkline(values, color = '#2E6CF6', lowBetter = false) {
  if (!values || values.length < 2) return '';
  const Wd = 120, Ht = 34, p = 4;
  let min = Math.min(...values), max = Math.max(...values); if (max === min) { max += 1; min -= 1; }
  const x = i => p + i * (Wd - 2 * p) / (values.length - 1);
  const y = v => lowBetter ? p + (v - min) * (Ht - 2 * p) / (max - min) : p + (max - v) * (Ht - 2 * p) / (max - min);
  const pts = values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${Wd} ${Ht}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}

function recordChart(en, exo) {
  if (en.length < 2) return '';
  const Wd = 340, Ht = 170, pl = 46, pr = 14, pt = 14, pb = 24;
  const vals = en.map(e => e.v);
  let min = Math.min(...vals), max = Math.max(...vals); const pad0 = (max - min) * .15 || 1; min -= pad0; max += pad0;
  const low = exo.better === 'low';
  const x = i => pl + i * (Wd - pl - pr) / (en.length - 1);
  const y = v => low ? pt + (v - min) * (Ht - pt - pb) / (max - min) : pt + (max - v) * (Ht - pt - pb) / (max - min);
  const pts = en.map((e, i) => `${x(i)},${y(e.v)}`).join(' ');
  const best = bestOf(en, exo.better);
  let g = '';
  [min + pad0, max - pad0].forEach(v => { g += `<line x1="${pl}" x2="${Wd - pr}" y1="${y(v)}" y2="${y(v)}" stroke="#E4EAF3" stroke-dasharray="3 4"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end" class="ax">${esc(fmtVal(v, exo.unit))}</text>`; });
  g += `<text x="${x(0)}" y="${Ht - 6}" text-anchor="start" class="ax">${frShort(en[0].d)}</text><text x="${x(en.length - 1)}" y="${Ht - 6}" text-anchor="end" class="ax">${frShort(en[en.length - 1].d)}</text>`;
  const dots = en.map((e, i) => `<circle cx="${x(i)}" cy="${y(e.v)}" r="${e === best ? 6 : 4}" fill="${e === best ? '#FFC531' : '#fff'}" stroke="${OUT}" stroke-width="2"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${Wd} ${Ht}" role="img" aria-label="Historique">${g}<polyline points="${pts}" fill="none" stroke="#2E6CF6" stroke-width="3" stroke-linejoin="round"/>${dots}</svg>`;
}

/* Classements */
function trendEl(r) {
  if (r.trend === undefined || r.trend === 0) return '';
  return r.trend > 0 ? `<span class="tr up">▲${r.trend}</span>` : `<span class="tr down">▼${-r.trend}</span>`;
}
function divBar(r, maxAbs) {
  const s = v => Math.min(50, (v / Math.max(1, maxAbs)) * 50).toFixed(1);
  return `<span class="dbar" aria-hidden="true"><i class="r" style="width:${s(r.minus)}%"></i><i class="g" style="width:${s(r.plus)}%"></i></span>`;
}
function rowGlobal(r, maxAbs) {
  return `<button class="row ${r.id === S.me ? 'me' : ''}" data-act="profile" data-id="${esc(r.id)}">
    <span class="rk rk${r.rank}">${r.rank}</span>${headEl(r.p)}
    <span class="who"><b>${esc(r.p.name)}</b>
      <span class="pm"><span class="p">+${r.plus}</span><span class="m">−${r.minus}</span>${trendEl(r)}</span>
      ${divBar(r, maxAbs)}</span>
    <span class="tot ${r.total < 0 ? 'neg' : ''}">${fmtN(r.total)}</span></button>`;
}
function dsq(d, i, big) {
  const lab = big ? `<em>${JL[i % 7]}</em>` : '';
  if (!d || d.state === 'future') return `<span class="dsq fut">${lab}</span>`;
  if (d.state === 'open') return `<span class="dsq open">${lab}</span>`;
  if (d.state === 'none') return `<span class="dsq fut">${lab}</span>`;
  if (d.state === 'miss') return `<span class="dsq miss" title="Non saisi">×${lab}</span>`;
  const c = d.total > 0 ? 'pos' : d.total < 0 ? 'neg' : 'zero';
  return `<span class="dsq ${c}">${fmtS(d.total)}${lab}</span>`;
}
function weekStrip(r, w, big) {
  const [a, b] = weekRange(w); let s = '';
  for (let i = a; i <= b; i++) s += dsq(r.days[i], i, big);
  return `<span class="days ${big ? 'big' : ''}">${s}</span>`;
}

function confetti(n = 70) {
  if (reduceMotion()) return;
  const box = $('#confetti'), cols = ['#2E6CF6', '#17B26A', '#FFC531', '#F04452', '#8B5CF6', '#0EA5E9'];
  for (let i = 0; i < n; i++) {
    const s = document.createElement('i');
    s.style.left = Math.random() * 100 + 'vw';
    s.style.background = cols[i % cols.length];
    s.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
    s.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    s.style.animationDuration = (1.1 + Math.random() * 1.1) + 's';
    s.style.animationDelay = (Math.random() * .25) + 's';

const YEAR_S = parseYmd(CONFIG.START).getFullYear(), YEAR_E = parseYmd(CONFIG.END).getFullYear();
const ordinal = n => n === 1 ? '1er' : n + 'e';
function progressPct() { const a = START_AT(), b = END_AT(); return Math.max(0, Math.min(100, (now() - a) / (b - a) * 100)); }
function cdParts(phase) {
  const target = phase === 'before' ? START_AT() : END_AT();
  let ms = Math.max(0, target - now());
  const d = Math.floor(ms / 864e5); ms -= d * 864e5;
  const h = Math.floor(ms / 36e5); ms -= h * 36e5;
  const m = Math.floor(ms / 6e4); const s = Math.floor((ms - m * 6e4) / 1000);
  return [d, h, m, s];
}
function timerCells(phase) {
  const p = cdParts(phase);
  return [['jours'], ['heures'], ['min'], ['sec']].map(([l], i) => `<div><b data-u="${i}">${pad(p[i])}</b><small>${l}</small></div>`).join('');
}

function podium() {

function heroBlock(phase) {
  const C = S.C, t = C.tIdx;

  if (phase === 'before') { big = `J-${-t}`; small = 'avant le départ'; metaTop = 'Départ'; metaSub = frLong(CONFIG.START); }
  else if (phase === 'during') {
    const left = TOTAL - 1 - t;
    big = `J-${left}`; small = left === 0 ? 'dernier jour, tout donner' : 'avant la ligne d’arrivée';
    metaTop = C.cw === SPRINT_WEEK ? 'Sprint final' : `Semaine ${C.cw}<i>/${FULL_WEEKS}</i>`;
    metaSub = `Jour ${t + 1} sur ${TOTAL}`;
  } else { big = 'Fini'; small = 'le Winter Arc est bouclé'; metaTop = 'Bravo'; metaSub = `${TOTAL} jours tenus`; }
  const pct = progressPct();
  return `<section class="hero ${phase}">

}

function weekBoard(w) {
  const C = S.C, Wk = C.W[w];
  const rs = C.list.filter(r => r.regIdx <= Wk.b).slice().sort((x, y) => (y.weeks[w] - x.weeks[w]) || x.p.name.localeCompare(y.p.name, 'fr'));
  if (!rs.length) return '';
  const nd = Wk.b - Wk.a + 1;
  const head = `<div class="row whead" aria-hidden="true"><span class="avh ghost"></span><span class="who"><span class="days">${JL.slice(0, nd).map(l => `<span class="dsq lbl">${l}</span>`).join('')}</span></span><span class="tot sm">pts</span></div>`;
  const rows = rs.map(r => {
    const lose = Wk.losers.includes(r.id), win = Wk.winners.includes(r.id);
    const tags = (win ? ' <span class="ti">👑</span>' : '') + (lose ? ' <span class="ti">🐢</span>' : '') + (r.dbl.has(w) ? ' <em class="tag red">malus ×2</em>' : '');
    return `<button class="row ${r.id === S.me ? 'me' : ''} ${lose ? 'lose' : ''}" data-act="profile" data-id="${esc(r.id)}">
      ${headEl(r.p)}<span class="who"><b>${esc(r.p.name)}${tags}</b>${weekStrip(r, w)}</span>
      <span class="tot ${r.weeks[w] < 0 ? 'neg' : ''}">${fmtN(r.weeks[w])}</span></button>`;
  }).join('');
  const verdict = dateAt(Wk.b + 2);
  const foot = w > FULL_WEEKS ? 'Sprint final : chaque point compte double.'
    : Wk.final ? '🐢 Lanterne rouge de la semaine : gage à réaliser.'
    : `🐢 Lanterne rouge provisoire. Verdict ${frLong(verdict)} à 0h.`;
  return `<div class="board">${head}${rows}</div><p class="board-foot">${foot}</p>`;
}

function gageCard() {
  const C = S.C; let lf = 0;
  for (let w = 1; w <= FULL_WEEKS; w++) if (C.W[w].final && C.W[w].losers.length) lf = w;
  if (!lf) {
    const verdict = dateAt(C.W[1].b + 2);
    return secTitle('Le gage') + `<div class="card gage"><p class="gage-lead">Le dernier de chaque semaine tire un gage sportif à réaliser dans les 7 jours.</p>
      <p class="muted">Premier verdict ${frLong(verdict)} à 0h, après le rattrapage du dimanche.</p>
      <button class="btn ghost sm" data-act="gages">Voir les ${GAGES.length} gages</button></div>`;
  }
  const Wk = C.W[lf], g = Wk.gage;
  const rev = lsGet('wa_rev_' + lf) === '1' || Wk.losers.some(id => S.players[id] && S.players[id].gages && S.players[id].gages[lf] && S.players[id].gages[lf].done);
  const deadline = dateAt(Wk.b + 7);
  const losers = Wk.losers.map(id => {
    const p = S.players[id]; if (!p) return '';
    const done = p.gages && p.gages[lf] && p.gages[lf].done;
    return `<span class="loser">${headEl(p)}<b>${esc(p.name)}</b>${rev ? (done ? '<em class="tag green">Fait</em>' : '<em class="tag red">À faire</em>') : ''}</span>`;
  }).join('');
  let body;
  if (!rev) body = `<div class="reel" id="reel"><div class="reel-strip"><div class="reel-item q">?</div></div></div><button class="btn block" data-act="spin" data-w="${lf}">Tirer le gage</button>`;
  else {
    const mine = Wk.losers.includes(S.me) && !(meP().gages && meP().gages[lf] && meP().gages[lf].done);
    body = `<div class="reel done"><div class="reel-item">${esc(g.t)}</div></div>
      <div class="gage-meta"><span class="tag">${esc(g.k)}</span><span>${flames(g.l)}</span><span>avant le ${frLong(deadline)}</span></div>
      ${mine ? `<button class="btn plus block" data-act="gagedone" data-w="${lf}">J’ai fait mon gage</button>` : ''}`;
  }
  return secTitle(`Gage de la semaine ${lf}`) + `<div class="card gage"><div class="losers">${losers}</div>${body}</div>`;
}

/* Records */
function deltaChip(pr, ex) {
  if (pr.en.length === 1) return '<span class="delta">1re perf</span>';
  if (!pr.gain) return '<span class="delta">stable</span>';
  const shown = ex.better === 'low' ? -pr.gain : pr.gain;
  const mag = ex.unit === 'time' ? fmtTime(Math.abs(pr.gain)) : fmtVal(Math.abs(pr.gain), ex.unit);
  return `<span class="delta ${pr.gain > 0 ? 'up' : 'down'}">${shown > 0 ? '+' : '−'}${mag}</span>`;
}
function viewRecords() {
  const me = meP();
  const cards = exoList(me).map(ex => {
    const pr = exoProgress(me, ex);
    const head = `<span class="lbl">${esc(ex.label)}</span>${ex.sub ? `<span class="rsub">${esc(ex.sub)}</span>` : `<span class="rsub">${UNITS[ex.unit] || ''}</span>`}`;
    if (!pr) return `<button class="rcard empty" data-act="rec" data-k="${esc(ex.key)}">${head}<span class="rnone">+ Noter</span></button>`;
    return `<button class="rcard" data-act="rec" data-k="${esc(ex.key)}">${head}<span class="val">${esc(fmtVal(pr.best.v, ex.unit))}</span>${deltaChip(pr, ex)}${sparkline(pr.en.map(e => e.v), '#2E6CF6', ex.better === 'low')}</button>`;
  }).join('');
  return `<h1 class="h1">Mes records</h1><p class="lede">Note une perf quand tu veux. L’historique et la progression se calculent tout seuls.</p>
    <div class="rgrid">${cards}<button class="rcard add" data-act="newexo"><span class="lbl">+</span><span class="rsub">Nouvel exo</span></button></div>`;
}

/* Trophées */
function palmRow(Wk) {
  const ppl = ids => ids.map(id => S.players[id]).filter(Boolean);
  const win = ppl(Wk.winners), los = ppl(Wk.losers);
  const people = arr => arr.map(p => `<span class="pp">${headEl(p, 'xs')}<b>${esc(p.name)}</b></span>`).join('');
  const score = arr => arr.length ? fmtN(S.C.R[arr[0].id].weeks[Wk.w]) : '';
  const rev = lsGet('wa_rev_' + Wk.w) === '1' || los.some(p => p.gages && p.gages[Wk.w] && p.gages[Wk.w].done);
  return `<div class="pw ${Wk.final ? '' : 'live'}">
    <div class="pw-h"><b>${weekName(Wk.w)}</b><span>${rangeLabel(Wk.a, Wk.b)}${Wk.final ? '' : ' (en cours)'}</span></div>
    <div class="pw-l"><span class="pw-ic">👑</span><span class="pw-ppl">${people(win) || '<em class="muted">égalité parfaite</em>'}</span><span class="pw-s">${score(win)}</span></div>
    ${Wk.w <= FULL_WEEKS ? `<div class="pw-l"><span class="pw-ic">🐢</span><span class="pw-ppl">${people(los) || '<em class="muted">personne</em>'}</span><span class="pw-s">${score(los)}</span></div>` : ''}
    ${Wk.final && los.length && Wk.gage ? `<div class="pw-g"><span>${rev ? esc(Wk.gage.t) : 'Gage pas encore tiré : rendez-vous sur l’accueil.'}</span><span>${los.map(p => (p.gages && p.gages[Wk.w] && p.gages[Wk.w].done) ? '✅' : '⏳').join(' ')}</span></div>` : ''}
  </div>`;
}
function viewTrophies() {
  const C = S.C;
  let h = '<h1 class="h1">Trophées</h1>';
  const weeks = []; for (let w = NWEEKS; w >= 1; w--) if (C.W[w].started) weeks.push(C.W[w]);
  if (!weeks.length) h += '<p class="lede">Le palmarès se remplit dès la première semaine. En attendant, voici ce qu’il y a à gagner.</p>';
  else h += secTitle('Palmarès des semaines') + `<div class="palm">${weeks.map(palmRow).join('')}</div>`;
  h += secTitle('Vitrine des badges', `${BADGES.length} à gagner`) + `<div class="vitrine">${BADGES.map(b => {
    const holders = C.list.filter(r => r.badges.has(b.key));
    return `<div class="vb ${holders.length ? '' : 'locked'} ${b.shame ? 'shame' : ''}"><span class="vb-em">${b.em}</span>
      <span class="vb-t"><b>${b.name}</b><small>${b.desc}</small></span>

  }).join('')}</div>`;
  return h;
}

function valueInputs(ex) {
  if (ex.unit === 'time') {
    const withH = ex.better === 'low';
    return `<div class="tin">${withH ? '<input class="field" id="rec-h" inputmode="numeric" placeholder="h" maxlength="2"><span>:</span>' : ''}<input class="field" id="rec-m" inputmode="numeric" placeholder="min" maxlength="3"><span>:</span><input class="field" id="rec-s" inputmode="numeric" placeholder="s" maxlength="2"></div>`;
  }
  return `<input class="field" id="rec-v" inputmode="decimal" placeholder="${ex.unit === 'kg' ? 'kg' : ex.unit === 'km' ? 'km' : 'répétitions'}">`;
}
function readValue(ex) {
  if (ex.unit === 'time') {
    const g = id => { const el = $(id); const v = el ? el.value.trim() : ''; return v === '' ? 0 : Number(v); };
    const h = g('#rec-h'), m = g('#rec-m'), s = g('#rec-s');
    if ([h, m, s].some(x => !Number.isFinite(x) || x < 0) || s >= 60) return null;
    const v = h * 3600 + m * 60 + s; return v > 0 ? v : null;
  }
  const v = parseFloat((($('#rec-v') || {}).value || '').replace(',', '.'));
  return v > 0 ? v : null;
}

function gate(step, msg) {
  S.gateStep = step;
  const g = $('#gate'); g.hidden = false; $('#app').hidden = true; closeSheet();
  g.innerHTML = `<div class="wrap gate-in">${GATES[step](msg)}</div>`;
  g.scrollTop = 0;
}
function updateDots() { const d = $('#pindots'); if (d) d.querySelectorAll('i').forEach((el, i) => el.classList.toggle('f', i < S.pin.value.length)); }
function pinPress(v) {
  if (!S.pin || S.pin.busy) return;
  if (v === 'del') S.pin.value = S.pin.value.slice(0, -1);
  else if (S.pin.value.length < 4) S.pin.value += v;
  updateDots();
  if (S.pin.value.length === 4) { S.pin.busy = true; setTimeout(pinDone, 140); }
}
function pinFail(msg) {
  S.pin.value = ''; S.pin.busy = false; updateDots();
  const d = $('#pindots'); if (d) { d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); }
  toast(msg, 'err');
}
async function pinDone() {
  const v = S.pin.value;
  if (S.pin.mode === 'login') {
    const p = S.players[S.pin.id];
    const h = await hashPin(p.id, v);
    let ok = false;
    try { ok = await DB.login(p.id, h); }
    catch (e) { pinFail(apiMessage(e)); return; }
    if (ok === true) { lsSet(LS.me, p.id); lsSet(LS.pin, h); S.me = p.id; S.pinHash = h; S.pin = null; enterApp(); toast(`Content de te revoir, ${p.name}`); }
    else pinFail('Code incorrect');
    return;
  }
  if (S.pin.step === 'set') { S.pin = { mode: 'set', step: 'confirm', first: v, value: '' }; gate('setpin'); return; }
  if (v !== S.pin.first) { S.pin = { mode: 'set', step: 'set', first: '', value: '' }; gate('setpin'); pinFail('Les deux codes ne correspondent pas'); return; }
  await createPlayer(v);
}
async function createPlayer(pin) {
  const name = S.ed.name.trim();
  gate('loading', 'Création de ton perso…');
  const id = slugify(name) + '-' + Math.random().toString(36).slice(2, 6);
  const data = { v: 1, id, name, createdAt: now().toISOString(), avatar: S.ed.av, days: {}, records: {}, customExos: [], gages: {} };
  const h = await hashPin(id, pin);
  try {
    const v = await DB.create(data, h);
    S.players[id] = data; S.vers[id] = v; cacheSave();
    lsSet(LS.me, id); lsSet(LS.pin, h); S.me = id; S.pinHash = h; S.pin = null;
    enterApp(); confetti(90); toast(`Bienvenue dans le Winter Arc, ${name}`, 'ok');
  } catch (e) {
    S.pin = null;
    if (e.kind === 'name_taken' || e.kind === 'bad_name') { gate('create'); toast(apiMessage(e), 'err'); return; }
    gate('error', apiMessage(e));
  }
}
function gNext() {
  const name = (S.ed.name || '').trim();
  if (name.length < 2) { toast('Indique ton prénom', 'err'); $('#ed-name') && $('#ed-name').focus(); return; }
  if (nameTaken(name)) { toast('Ce prénom est déjà pris : ajoute l’initiale de ton nom', 'err'); return; }
  S.pin = { mode: 'set', step: 'set', first: '', value: '' };
  gate('setpin');
}

}
const VIEWS = { home: viewHome, log: viewLog, records: viewRecords, trophies: viewTrophies, me: viewMe };
function renderView() {

function go(v) {

}
function enterApp() {

}
async function load() {
  try {
    const list = await DB.loadAll();
    const players = {}, vers = {};
    list.forEach(x => { players[x.data.id] = x.data; vers[x.data.id] = x.ver; });
    S.players = players; S.vers = vers; S.offline = false; cacheSave();
  } catch (e) {
    if (e.kind === 'network') { const c = cacheLoad(); if (c) { S.players = c.players; S.vers = c.vers || {}; S.offline = true; return; } }
    throw e;
  }
}
async function start() {
  if (!configReady()) return gate('error', apiMessage({ kind: 'config' }));
  gate('loading');
  try { await load(); await loadPhotos(); }
  catch (e) {
    if (e.kind === 'invalid_code') { lsDel(LS.token); S.token = null; return gate('token', apiMessage(e)); }
    return gate('error', apiMessage(e));
  }
  if (S.me && S.players[S.me] && S.pinHash) { enterApp(); if (S.offline) toast('Hors ligne : dernières données connues'); }
  else { forgetMe(); gate('welcome'); }
}
function forgetMe() { lsDel(LS.me); lsDel(LS.pin); S.me = null; S.pinHash = null; }
function handleSaveError(e) {
  if (e.kind === 'bad_pin') { forgetMe(); gate('welcome'); toast(apiMessage(e), 'err'); return; }
  if (e.kind === 'invalid_code') { lsDel(LS.token); S.token = null; gate('token', apiMessage(e)); return; }
  toast(apiMessage(e), 'err');
}
async function refresh(manual) {
  if (S.refreshing || S.saving) return;
  S.refreshing = true;

/* ---------- Sauvegardes ---------- */
async function saveDay() {
  if (S.saving) return;
  const me = clone(meP()), d = S.logDate;
  if (!editableDates().some(o => o.d === d)) { toast('Cette journée est verrouillée', 'err'); go('log'); return; }
  me.days = me.days || {};
  me.days[d] = { b: [...S.draft.b].sort(), m: [...S.draft.m].sort(), ts: Date.now() };
  S.saving = true; renderView();
  try {
    await savePlayer(me, `${me.name} : journée du ${d}`);
    S.saving = false; S.C = compute(); renderView();
    const stt = S.C.R[S.me].days[idxOf(d)];
    toast(`Journée enregistrée : ${fmtS(stt.total)}${stt.total > 0 ? ' 🔥' : ''}`, stt.total > 0 ? 'ok' : '');
    if (stt.total > 0) confetti();
  } catch (e) { S.saving = false; renderView(); handleSaveError(e); }
}
async function withSave(mutator, message, after) {
  const me = clone(meP());
  const r = mutator(me); if (r === false) return;
  try { await savePlayer(me, message); S.C = compute(); renderView(); after && after(); }
  catch (e) { handleSaveError(e); }
}
function markGage(w) {
  withSave(me => { me.gages = me.gages || {}; me.gages[w] = { done: true, ts: Date.now() }; }, `${meP().name} : gage semaine ${w} réalisé`, () => { toast('Gage validé. Respect.', 'ok'); confetti(); });
}
function spinReel(w) {
  const el = $('#reel'); const btn = document.querySelector('[data-act="spin"]');
  const finish = () => { lsSet('wa_rev_' + w, '1'); renderView(); };
  if (!el || reduceMotion()) return finish();
  if (btn) btn.disabled = true;
  const g = gageFor(w), items = [];
  for (let i = 0; i < 26; i++) items.push(GAGES[(i * 7 + w) % GAGES.length].t);
  items.push(g.t);
  el.innerHTML = `<div class="reel-strip">${items.map(t => `<div class="reel-item">${esc(t)}</div>`).join('')}</div>`;
  const strip = el.firstChild, h = el.clientHeight;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    strip.style.transition = 'transform 3s cubic-bezier(.12,.72,.14,1)';
    strip.style.transform = `translateY(${-(items.length - 1) * h}px)`;
  }));
  setTimeout(() => { el.classList.add('done'); }, 3050);
  setTimeout(finish, 3700);
}
function addRecord(key) {
  const ex = exoList(meP()).find(e => e.key === key); if (!ex) return;
  const v = readValue(ex), d = ($('#rec-d') || {}).value;
  if (!v) { toast('Indique une valeur valide', 'err'); return; }
  if (!d || d > today()) { toast('Choisis une date passée ou du jour', 'err'); return; }
  const prev = exoProgress(meP(), ex), prevBest = prev && prev.best;
  const btn = document.querySelector('[data-act="addrec"]'); if (btn) { btn.disabled = true; btn.textContent = 'Enregistrement…'; }
  withSave(me => { me.records = me.records || {}; (me.records[key] = me.records[key] || []).push({ d, v }); },
    `${meP().name} : perf ${ex.label}`, () => {
      sheetRecord(key);
      const isBest = prevBest && (ex.better === 'low' ? v < prevBest.v : v > prevBest.v);
      if (isBest) { toast('Nouveau record personnel 🏅', 'ok'); confetti(); } else toast('Perf ajoutée');
    }).finally(() => { if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = 'Ajouter la perf'; } });
}
function delRecord(key, d, v) {
  if (!window.confirm('Supprimer cette perf ?')) return;
  withSave(me => {
    const arr = (me.records || {})[key] || []; const i = arr.findIndex(e => e.d === d && Number(e.v) === Number(v));
    if (i < 0) return false; arr.splice(i, 1);
  }, `${meP().name} : perf supprimée`, () => sheetRecord(key));
}
function createExo() {
  const name = (($('#nx-name') || {}).value || '').trim();

  const key = 'c_' + Date.now().toString(36);
  withSave(me => { me.customExos = me.customExos || []; me.customExos.push({ key, label: name, unit: S.newExo.unit, better: S.newExo.better }); },
    `${meP().name} : nouvel exo ${name}`, () => sheetRecord(key));
}
function delExo(key) {
  if (!window.confirm('Supprimer cet exo et tout son historique ?')) return;
  withSave(me => { me.customExos = (me.customExos || []).filter(e => e.key !== key); if (me.records) delete me.records[key]; },
    `${meP().name} : exo supprimé`, () => { closeSheet(); toast('Exo supprimé'); });

/* ---------- Mur photo ---------- */
const PHOTO_DAYS = 7;
const dayLabel = d => { const n = idxOf(today()) - idxOf(d); return n === 0 ? 'Aujourd’hui' : n === 1 ? 'Hier' : frShort(d); };
const visiblePhotos = () => S.photos.filter(f => S.players[f.pid]);
const myPhotoToday = () => visiblePhotos().find(f => f.pid === S.me && f.day === today());

async function loadPhotos() {
  try {
    const d = parseYmd(today()); d.setDate(d.getDate() - (PHOTO_DAYS - 1));
    const rows = await DB.photoList(ymd(d));
    S.photos = (Array.isArray(rows) ? rows : []).filter(r => r && r.id && r.pid && r.day);
    S.photosReady = true;
  } catch (e) {
    if (e.kind === 'setup') S.photosReady = false;
  }
}

function phImg(f) {
  const src = S.photoImg[f.id];
  return `<span class="ph-img" data-pid="${f.id}">${src ? `<img src="${src}" alt="">` : '<i class="ph-load"></i>'}</span>`;
}
function photoStrip() {
  if (!S.photosReady) return '';
  const list = visiblePhotos(), mine = myPhotoToday();
  const first = mine
    ? `<button class="ph mine" data-act="ph-mine">${phImg(mine)}<span class="ph-badge">Ta photo</span><span class="ph-who"><b>Modifier</b></span></button>`
    : `<button class="ph add" data-act="ph-add"><span class="ph-plus">+</span><b>Ma photo du jour</b><small>Une par jour, visible par tous les joueurs</small></button>`;
  const cards = list.map((f, i) => {
    if (f === mine) return '';
    const p = S.players[f.pid];
    return `<button class="ph" data-act="ph-open" data-i="${i}">${phImg(f)}${f.caption ? `<span class="ph-cap">${esc(f.caption)}</span>` : ''}<span class="ph-who">${headEl(p, 'xs')}<b>${esc(p.name)}</b><em>${dayLabel(f.day)}</em></span></button>`;
  }).join('');
  const n = list.length;
  return secTitle('Le mur', n ? `${n} photo${n > 1 ? 's' : ''} sur 7 jours` : 'poste la première')
    + `<div class="strip" id="strip">${first}${cards || '<div class="ph empty"><span>📸</span><small>Les photos des autres joueurs apparaîtront ici</small></div>'}</div>`;
}
function photoCta() {
  if (!S.photosReady) return '';
  const mine = myPhotoToday();
  return `<div class="invite ph-cta"><div><b>${mine ? 'Photo du jour publiée' : 'Ta photo du jour'}</b><span>${mine ? 'Elle est visible sur le mur de l’accueil.' : 'Montre ta séance aux autres, une photo par jour.'}</span></div><button class="btn sm" data-act="${mine ? 'ph-mine' : 'ph-add'}">${mine ? 'Voir' : 'Ajouter'}</button></div>`;
}

/* Chargement des images à la demande (par lots de 12) */
const phQueue = new Set(); let phTimer = null, phObserver = null;
function requestImgs(ids) {
  ids.forEach(id => { if (id && !S.photoImg[id] && !S.phLoading.has(id)) phQueue.add(id); });
  clearTimeout(phTimer); phTimer = setTimeout(flushImgs, 60);
}
async function flushImgs() {
  const ids = [...phQueue].slice(0, 12);
  if (!ids.length) return;
  ids.forEach(id => { phQueue.delete(id); S.phLoading.add(id); });
  try { const rows = await DB.photoGet(ids); (rows || []).forEach(r => { S.photoImg[r.id] = r.img; paintImg(r.id); }); }
  catch (e) { /* réessai au prochain affichage */ }
  finally { ids.forEach(id => S.phLoading.delete(id)); if (phQueue.size) flushImgs(); }
}
function paintImg(id) {
  document.querySelectorAll(`[data-pid="${id}"]`).forEach(el => { if (!el.querySelector('img')) el.innerHTML = `<img src="${S.photoImg[id]}" alt="">`; });
}
function hydrateStrip() {
  const strip = $('#strip'); if (!strip) return;
  if (phObserver) phObserver.disconnect();
  const pending = [...strip.querySelectorAll('.ph-img')].filter(el => !el.querySelector('img'));
  if (!pending.length) return;
  if ('IntersectionObserver' in window) {
    phObserver = new IntersectionObserver(entries => {
      const ids = entries.filter(e => e.isIntersecting).map(e => +e.target.dataset.pid);
      if (ids.length) requestImgs(ids);
    }, { root: strip, rootMargin: '0px 400px 0px 400px' });
    pending.forEach(el => phObserver.observe(el));
  } else requestImgs(pending.slice(0, 6).map(el => +el.dataset.pid));
}

/* Ajout */
function pickPhoto() { const inp = $('#ph-file'); inp.value = ''; inp.click(); }
async function compressImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 720, r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * r)), h = Math.max(1, Math.round(img.naturalHeight * r));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
    let q = 0.78, out = c.toDataURL('image/jpeg', q);
    while (out.length > 220000 && q > 0.35) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
    if (!out.startsWith('data:image/jpeg') || out.length > 390000) throw new Error('size');
    return out;
  } finally { URL.revokeObjectURL(url); }
}
document.addEventListener('change', async e => {
  if (e.target.id !== 'ph-file') return;
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  try { S.phDraft = await compressImage(file); sheetPhotoPreview(); }
  catch (err) { toast('Impossible de lire cette image, essaie une autre photo', 'err'); }
});
function sheetPhotoPreview() {
  openSheet(`<h2 class="h2">Ta photo du jour</h2><p class="muted">${frLong(today())}. Visible par tous les joueurs du challenge.</p>
    <div class="ph-prev"><img src="${S.phDraft}" alt=""></div>
    <label class="lbl-s" for="ph-cap">Légende <small>(facultatif)</small></label>
    <input class="field" id="ph-cap" maxlength="80" placeholder="ex. Séance jambes, 10 km sous la neige">
    <button class="btn block" data-act="ph-publish">Publier</button>
    <button class="btn ghost block" data-act="ph-add">Choisir une autre photo</button>`);
}
async function publishPhoto() {
  if (!S.phDraft) return;
  const btn = document.querySelector('[data-act="ph-publish"]');
  if (btn) { btn.disabled = true; btn.textContent = 'Publication…'; }
  try {
    const id = await DB.photoSave(today(), S.phDraft, (($('#ph-cap') || {}).value || '').trim());
    if (id) S.photoImg[id] = S.phDraft;
    S.phDraft = null; closeSheet();
    await loadPhotos(); renderView();
    toast('Photo publiée sur le mur 📸', 'ok'); confetti(40);
  } catch (e) {
    if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = 'Publier'; }
    handleSaveError(e);
  }
}
function sheetMine() {
  const mine = myPhotoToday();
  if (!mine) return pickPhoto();
  openSheet(`<h2 class="h2">Ta photo du jour</h2><div class="ph-prev">${phImg(mine)}</div>${mine.caption ? `<p class="muted c">${esc(mine.caption)}</p>` : ''}
    <button class="btn block" data-act="ph-add">Remplacer la photo</button>
    <button class="btn ghost danger block" data-act="ph-del" data-d="${mine.day}">Supprimer</button>`);
  requestImgs([mine.id]);
}
async function deletePhoto(day) {
  if (!window.confirm('Supprimer ta photo ?')) return;
  try { await DB.photoDelete(day); closeSheet(); closeViewer(); await loadPhotos(); renderView(); toast('Photo supprimée'); }
  catch (e) { handleSaveError(e); }
}

/* Visionneuse plein écran (glisser pour passer d'une photo à l'autre) */
function openViewer(i) {
  const list = visiblePhotos(); if (!list.length) return;
  const v = $('#viewer');
  v.innerHTML = `<div class="vw-top"><span>Le mur</span><button class="vw-x" data-act="vw-close" aria-label="Fermer">${ICON.close}</button></div>
    <div class="vw-track" id="vw-track">${list.map(f => {
      const p = S.players[f.pid];
      return `<div class="vw-slide"><div class="vw-in"><div class="vw-who">${headEl(p, 'xs')}<b>${esc(p.name)}</b><em>${dayLabel(f.day)}</em></div>${phImg(f)}
        ${f.caption ? `<p class="vw-cap">${esc(f.caption)}</p>` : ''}${f.pid === S.me ? `<button class="btn ghost sm danger" data-act="ph-del" data-d="${f.day}">Supprimer ma photo</button>` : ''}</div></div>`;
    }).join('')}</div>`;
  v.hidden = false; document.body.classList.add('noscroll');
  const tr = $('#vw-track');
  tr.scrollLeft = Math.max(0, i) * tr.clientWidth;
  const around = () => { const k = Math.round(tr.scrollLeft / Math.max(1, tr.clientWidth)); requestImgs(list.slice(Math.max(0, k - 1), k + 3).map(f => f.id)); };
  around();
  tr.addEventListener('scroll', () => { clearTimeout(tr._t); tr._t = setTimeout(around, 80); }, { passive: true });
}
function closeViewer() {
  const v = $('#viewer'); if (v.hidden) return;
  v.hidden = true; v.innerHTML = '';
  if ($('#sheet').hidden) document.body.classList.remove('noscroll');
}

/* Démarrage */
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
if (window.__WA_DEBUG) window.__WA = { S, compute, gageFor, GAGE_ORDER, weekRange, dateAt, idxOf };
boot();

})();
